<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <style>
    :root{
      --navy-900:#0B1E39; --blue-700:#154FC0; --blue-500:#2F6FED; --blue-100:#E3ECFF; --sky-050:#F5F8FF;
      --surface:#FFFFFF; --ink-900:#101828; --ink-600:#4A5568; --ink-300:#D6DEEB;
      --success:#15825B; --success-bg:#E3F6ED; --warning:#B4740E; --warning-bg:#FBEDD3;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{font-family:"Manrope",ui-sans-serif,system-ui,sans-serif; background:var(--sky-050); color:var(--ink-900);}
    .mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;}
    .btn-primary{background:var(--blue-500); color:#fff; border:none; border-radius:16px; padding:20px; font-weight:800; font-size:1.15rem; width:100%; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;}
    .btn-primary:hover{background:var(--blue-700);}
    .pill-success{background:var(--success-bg); color:var(--success); font-size:0.68rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:4px 9px; border-radius:99px; display:inline-flex;}
  </style>
</helmet>

<div style="width:390px; min-height:760px; background:var(--sky-050); display:flex; flex-direction:column;">

  <div style="padding:16px 20px 6px; font-size:0.68rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--blue-700); font-family:'DM Mono',monospace;">02 · Home / Clock · 390px · Clock-Out state</div>

  <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 20px 20px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:34px; height:34px; border-radius:50%; background:var(--navy-900); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:0.85rem;">JM</div>
      <div>
        <div style="font-weight:700; font-size:0.92rem;">Hi, Jasmine</div>
        <div class="mono" style="font-size:0.7rem; color:var(--ink-600);">Tue, Aug 20</div>
      </div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-600)" stroke-width="2"><path d="M17 16l4-4-4-4M21 12H9"/><path d="M13 21H7a2 2 0 01-2-2V5a2 2 0 012-2h6"/></svg>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 28px;">

    <div style="width:100%; background:var(--surface); border:1px solid var(--ink-300); border-radius:20px; padding:28px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px;">
      <span class="pill-success">Currently clocked in</span>
      <div style="font-family:'DM Mono',monospace; font-size:2.1rem; font-weight:500; color:var(--navy-900);">2h 14m</div>
      <p style="font-size:0.85rem; color:var(--ink-600);">Since <span class="mono">8:02 AM</span></p>
      <button class="btn-primary" style="margin-top:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="white" stroke="none"/></svg>
        Clock Out
      </button>
    </div>

    <div style="width:100%; margin-top:28px;">
      <div style="font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-600); margin-bottom:10px;">Today</div>
      <div style="background:var(--surface); border:1px solid var(--ink-300); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px;">
        <div style="width:38px; height:38px; border-radius:9px; background:var(--blue-100); overflow:hidden; flex:none;"></div>
        <div style="flex:1;">
          <div style="font-size:0.85rem; font-weight:600;">Clocked In</div>
          <div class="mono" style="font-size:0.75rem; color:var(--ink-600);">8:02 AM</div>
        </div>
        <span class="pill-success">On time</span>
      </div>
    </div>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
