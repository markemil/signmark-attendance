<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <style>
    :root{
      --navy-900:#0B1E39; --blue-700:#154FC0; --blue-500:#2F6FED; --blue-100:#E3ECFF; --sky-050:#F5F8FF;
      --surface:#FFFFFF; --ink-900:#101828; --ink-600:#4A5568; --ink-300:#D6DEEB;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;}
    .mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;}
    .label{font-size:0.78rem; font-weight:700; color:var(--ink-600); margin-bottom:8px; display:block;}
    .btn-primary{background:var(--blue-500); color:#fff; border:none; border-radius:10px; padding:12px 20px; font-weight:700; font-size:0.88rem; cursor:pointer;}
    .btn-secondary{background:#fff; color:var(--navy-900); border:1.5px solid var(--ink-300); border-radius:10px; padding:12px 20px; font-weight:700; font-size:0.88rem; cursor:pointer;}
    .chip{border:1.5px solid var(--ink-300); border-radius:10px; padding:10px 14px; font-size:0.85rem; font-weight:600; text-align:center; cursor:pointer;}
    .chip.selected{background:var(--blue-100); border-color:var(--blue-500); color:var(--blue-700);}
    .fmt{border:1.5px solid var(--ink-300); border-radius:12px; padding:14px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;}
    .fmt.selected{background:var(--blue-100); border-color:var(--blue-500);}
  </style>
</helmet>

<div style="width:1280px; min-height:760px; background:var(--sky-050); position:relative; font-size:0.9rem;">

  <div style="padding:16px 36px 6px; font-size:0.68rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--blue-700); font-family:'DM Mono',monospace;">10 · Export Modal · 1280px</div>

  <div style="padding:40px; filter:blur(1px); opacity:0.45;">
    <h1 style="font-size:1.25rem; font-weight:800; color:var(--navy-900);">Jasmine Mercado</h1>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-top:20px;">
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:80px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:80px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:80px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:80px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:80px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:80px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:80px;"></div>
    </div>
  </div>

  <div style="position:absolute; inset:0; top:60px; background:rgba(11,30,57,0.35);"></div>

  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:480px; background:#fff; border-radius:18px; box-shadow:0 20px 60px rgba(11,30,57,0.35); padding:26px;">

    <h2 style="font-size:1.05rem; font-weight:800; color:var(--navy-900); margin-bottom:2px;">Export attendance</h2>
    <p style="font-size:0.82rem; color:var(--ink-600); margin-bottom:20px;">For <strong>Jasmine Mercado</strong> — this export covers one employee at a time.</p>

    <div style="margin-bottom:18px;">
      <label class="label">Cutoff period</label>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
        <div class="chip selected">Aug 1–15</div>
        <div class="chip">Aug 16–31</div>
        <div class="chip">Custom range</div>
      </div>
    </div>

    <div style="margin-bottom:22px;">
      <label class="label">Format</label>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
        <div class="fmt selected">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blue-700)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 16h8M8 8h4"/></svg>
          <span style="font-size:0.8rem; font-weight:700;">Excel</span>
        </div>
        <div class="fmt">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-600)" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
          <span style="font-size:0.8rem; font-weight:700; color:var(--ink-600);">CSV</span>
        </div>
        <div class="fmt">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-600)" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
          <span style="font-size:0.8rem; font-weight:700; color:var(--ink-600);">PDF</span>
        </div>
      </div>
    </div>

    <div style="background:var(--sky-050); border-radius:10px; padding:12px 14px; margin-bottom:20px; font-size:0.8rem; color:var(--ink-600); display:flex; justify-content:space-between;">
      <span>Includes</span>
      <span class="mono" style="color:var(--navy-900);">date · in · out · hours · status · photo ref</span>
    </div>

    <div style="display:flex; gap:10px;">
      <button class="btn-secondary" style="flex:1;">Cancel</button>
      <button class="btn-primary" style="flex:1;">Export Excel</button>
    </div>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
