<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <style>
    :root{
      --navy-900:#0B1E39; --blue-700:#154FC0; --blue-500:#2F6FED; --blue-100:#E3ECFF; --sky-050:#F5F8FF;
      --surface:#FFFFFF; --ink-900:#101828; --ink-600:#4A5568; --ink-300:#D6DEEB;
      --warning:#B4740E; --warning-bg:#FBEDD3; --critical:#C13A34;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;}
    .mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;}
    .input{width:100%; border:1.5px solid var(--ink-300); border-radius:10px; padding:11px 13px; font-size:0.88rem; font-family:"Manrope"; color:var(--ink-900); background:#fff;}
    .label{font-size:0.78rem; font-weight:700; color:var(--ink-600); margin-bottom:6px; display:block;}
    .btn-primary{background:var(--blue-500); color:#fff; border:none; border-radius:10px; padding:12px 20px; font-weight:700; font-size:0.88rem; cursor:pointer;}
    .btn-secondary{background:#fff; color:var(--navy-900); border:1.5px solid var(--ink-300); border-radius:10px; padding:12px 20px; font-weight:700; font-size:0.88rem; cursor:pointer;}
  </style>
</helmet>

<div style="width:1280px; min-height:820px; background:var(--sky-050); position:relative; font-size:0.9rem;">

  <div style="position:absolute; top:0; left:0; padding:16px 36px 6px; font-size:0.68rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--blue-700); font-family:'DM Mono',monospace; z-index:3;">08 · Admin Manual Punch · 1280px</div>

  <!-- dimmed calendar behind -->
  <div style="padding:60px 36px; filter:blur(1px); opacity:0.5;">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px;">
      <div style="width:44px; height:44px; border-radius:50%; background:linear-gradient(160deg,#c9d9f5,#8fb0e8);"></div>
      <div>
        <h1 style="font-size:1.25rem; font-weight:800; color:var(--navy-900);">Karla Dizon</h1>
        <p style="color:var(--ink-600); font-size:0.85rem;">EMP-0091 · Night shift</p>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:10px;">
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:92px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:92px;"></div>
      <div style="background:var(--critical); opacity:0.15; border-radius:10px; height:92px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:92px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:92px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:92px;"></div>
      <div style="background:#fff; border:1px solid var(--ink-300); border-radius:10px; height:92px;"></div>
    </div>
  </div>

  <!-- scrim -->
  <div style="position:absolute; inset:0; background:rgba(11,30,57,0.35); z-index:1;"></div>

  <!-- modal -->
  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:460px; background:#fff; border-radius:18px; box-shadow:0 20px 60px rgba(11,30,57,0.35); padding:26px; z-index:2;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
      <h2 style="font-size:1.05rem; font-weight:800; color:var(--navy-900);">Add time in/out</h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-600)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <p style="font-size:0.82rem; color:var(--ink-600); margin-bottom:20px;">For Karla Dizon — Aug 18, 2026. This creates a punch on her behalf; it won't have her photo.</p>

    <div style="display:flex; gap:10px; margin-bottom:14px;">
      <button style="flex:1; background:var(--blue-100); color:var(--blue-700); border:none; border-radius:10px; padding:10px; font-weight:700; font-size:0.85rem;">Time In</button>
      <button style="flex:1; background:#fff; color:var(--ink-600); border:1.5px solid var(--ink-300); border-radius:10px; padding:10px; font-weight:700; font-size:0.85rem;">Time Out</button>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:14px;">
      <div style="flex:1;"><label class="label">Date</label><input class="input mono" value="2026-08-18" readonly></div>
      <div style="flex:1;"><label class="label">Time</label><input class="input mono" value="06:04 AM" readonly></div>
    </div>

    <div style="margin-bottom:6px;">
      <label class="label" style="display:flex; align-items:center; gap:6px;">
        Reason for manual entry
        <span style="color:var(--critical); font-weight:800;">*</span>
      </label>
      <textarea class="input" rows="3" style="resize:none;" readonly>Phone broken — confirmed shift with supervisor via radio.</textarea>
      <p style="font-size:0.74rem; color:var(--warning); margin-top:6px; display:flex; align-items:center; gap:5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r="0.5" fill="currentColor"/></svg>
        Required — this record will be flagged "Admin-entered" everywhere it appears.
      </p>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-secondary" style="flex:1;">Cancel</button>
      <button class="btn-primary" style="flex:1;">Save punch</button>
    </div>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
